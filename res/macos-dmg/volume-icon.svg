<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Mounted-volume mark: a silver disk with the smaller BGDesk badge inside. -->
  <defs>
    <linearGradient id="disk-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfcfe"/>
      <stop offset="42%" stop-color="#e7eef5"/>
      <stop offset="100%" stop-color="#c2cedb"/>
    </linearGradient>
    <linearGradient id="disk-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d5dee8"/>
      <stop offset="100%" stop-color="#8e9aab"/>
    </linearGradient>
    <linearGradient id="disk-well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9e2ec"/>
      <stop offset="100%" stop-color="#c5d0dc"/>
    </linearGradient>
    <filter id="disk-shadow" x="-25%" y="-15%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#1a2a3a" flood-opacity="0.28"/>
    </filter>
    <filter id="badge-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0e538c" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#disk-shadow)">
    <rect x="152" y="196" width="720" height="608" rx="112" fill="url(#disk-rim)"/>
    <rect x="168" y="208" width="688" height="568" rx="100" fill="url(#disk-face)"/>
    <rect x="222" y="258" width="580" height="456" rx="80" fill="url(#disk-well)"/>
    <rect x="236" y="270" width="552" height="24" rx="12" fill="#ffffff" opacity="0.45"/>
    <rect x="430" y="722" width="164" height="18" rx="9" fill="#9aa7b6" opacity="0.7"/>
  </g>

  <!-- Brand mark at ~48% of the disk face, so the volume still reads as a disk. -->
  <g transform="translate(336 292) scale(11)" filter="url(#badge-shadow)">
    <path d="M22.6894531,28.2763672c-2.0419922-1.9453125-3.3144531-4.9814453-3.4902344-8.3291016-.0283203-.53125-.4667969-.9472656-.9990234-.9472656h-4.4003906c-.5317383,0-.9707031.4160156-.9985352.9472656-.1762695,3.3476562-1.4482422,6.3837891-3.4907227,8.328125-.2963867.2822266-.3911133.7167969-.2392578,1.0957031.1518555.3798828.5200195.6289062.9287109.6289062h12c.4091797,0,.7763672-.2490234.9287109-.6289062.1513672-.3789062.0566406-.8134766-.2392578-1.0947266Z" fill="#0e538c"/>
    <rect x="1" y="2" width="30" height="22" rx="3" ry="3" fill="#027af2"/>
    <line x1="14" y1="22" x2="18" y2="22" fill="none" stroke="#e3faff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
    <path d="M10.5,12l4.2999992,4.2999992,8.6000023-8.6000004" fill="none" stroke="#e3faff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
  </g>
</svg>
