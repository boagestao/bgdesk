<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <!--
    Artwork 800x400, inside an 800x480 Finder window with room for window chrome.
    Real icons sit on top at (200,190) and (600,190).
    Keep those zones empty; the arrow in the gap is the install hint.
  -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf3fb"/>
      <stop offset="100%" stop-color="#f7fafc"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e538c"/>
      <stop offset="100%" stop-color="#027af2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#page)"/>
  <circle cx="400" cy="190" r="210" fill="#027af2" opacity="0.05"/>

  <!-- Clear circles where Finder draws BGDesk.app and Applications. -->
  <circle cx="200" cy="190" r="86" fill="#ffffff" opacity="0.35"/>
  <circle cx="600" cy="190" r="86" fill="#ffffff" opacity="0.35"/>

  <path fill="url(#arrow)" d="M304 178 H438 V152 L512 190 L438 228 V202 H304 A12 12 0 0 1 304 178 Z"/>

  <text x="400" y="348" text-anchor="middle" fill="#394a63"
        font-family="Noto Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="600">Arraste para Aplicativos</text>
  <text x="400" y="374" text-anchor="middle" fill="#5b6b7c"
        font-family="Noto Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="13">para instalar o BGDesk</text>
</svg>
