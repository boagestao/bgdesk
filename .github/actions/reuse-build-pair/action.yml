name: Reuse approved edition packages
description: Download a completed build of this version and validate both editions without compiling
inputs:
  platform:
    required: true
    description: Target operating system
  arch:
    required: true
    description: Target architecture
  source-run:
    required: true
    description: Approved main workflow run
  source-commit:
    required: true
    description: Exact commit recorded by the source run
runs:
  using: composite
  steps:
    - name: Restore and verify both editions
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PLATFORM: ${{ inputs.platform }}
        ARCH: ${{ inputs.arch }}
        SOURCE_RUN: ${{ inputs.source-run }}
        SOURCE_COMMIT: ${{ inputs.source-commit }}
      run: python scripts/ci/reuse-builds.py --platform "$PLATFORM" --arch "$ARCH" --run "$SOURCE_RUN" --commit "$SOURCE_COMMIT"
    - name: Save reused cliente outputs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: build-${{ inputs.platform }}-${{ inputs.arch }}-cliente
        path: release-artifacts/${{ inputs.platform }}-${{ inputs.arch }}-cliente/*
        if-no-files-found: error
        retention-days: 14
    - name: Save reused suporte outputs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: build-${{ inputs.platform }}-${{ inputs.arch }}-suporte
        path: release-artifacts/${{ inputs.platform }}-${{ inputs.arch }}-suporte/*
        if-no-files-found: error
        retention-days: 14
