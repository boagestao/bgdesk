name: Build one BGDesk edition
description: Build, sign, and save an edition using the runner's shared toolchain and dependencies
inputs:
  platform:
    description: Target operating system
    required: true
  arch:
    description: Target architecture
    required: true
  edition:
    description: cliente or suporte
    required: true
runs:
  using: composite
  steps:
    - name: Select edition
      shell: bash
      env:
        EDITION: ${{ inputs.edition }}
      run: |
        case "$EDITION" in
          cliente) echo 'BGDESK_CLIENTE=1' >> "$GITHUB_ENV" ;;
          suporte) echo 'BGDESK_CLIENTE=0' >> "$GITHUB_ENV" ;;
          *) echo "Unknown edition: $EDITION" >&2; exit 1 ;;
        esac
    - name: Build signed and notarized DMG
      if: inputs.platform == 'macos'
      shell: bash
      env:
        BGDESK_CHECKPOINT_DIR: ${{ github.workspace }}/checkpoints/${{ inputs.edition }}
        BGDESK_EDITION: ${{ inputs.edition }}
        BGDESK_ARCH: ${{ inputs.arch }}
      run: |
        args=(mac)
        [[ "$BGDESK_CLIENTE" == 0 ]] || args=(cliente mac)
        bash build.sh "${args[@]}"
    - name: Build Windows app and installer
      if: inputs.platform == 'windows' && inputs.arch == 'x86_64'
      shell: bash
      run: |
        # The shared bridge artifact is already in the workspace.
        args=(windows)
        [[ "$BGDESK_CLIENTE" == 0 ]] || args=(cliente windows)
        bash build.sh "${args[@]}"
    - name: Build Win32 app with the existing Sciter UI
      if: inputs.platform == 'windows' && inputs.arch == 'x86'
      shell: bash
      env:
        EDITION: ${{ inputs.edition }}
      run: python scripts/ci/build-windows-x86.py --edition "$EDITION"
    - name: Sign Windows app
      if: inputs.platform == 'windows'
      shell: pwsh
      env:
        EDITION: ${{ inputs.edition }}
        ARCH: ${{ inputs.arch }}
      run: ./scripts/ci/sign-windows.ps1 -Path "build/windows-${env:ARCH}-$env:EDITION/extracted/bgdesk.exe"
    - name: Rebuild Inno installer containing the signed app
      if: inputs.platform == 'windows'
      shell: bash
      env:
        EDITION: ${{ inputs.edition }}
        ARCH: ${{ inputs.arch }}
      run: bash installers/build-installer.sh "$EDITION" "$ARCH"
    - name: Sign Windows installer
      if: inputs.platform == 'windows'
      shell: pwsh
      env:
        EDITION: ${{ inputs.edition }}
        ARCH: ${{ inputs.arch }}
      run: |
        $suffix = if ($env:ARCH -eq 'x86') { 'win32' } else { 'win64' }
        ./scripts/ci/sign-windows.ps1 -Path "build/windows-${env:ARCH}-$env:EDITION/bgdesk-${env:EDITION}-$suffix.exe"
    - name: Build native Windows update package
      if: inputs.platform == 'windows'
      shell: bash
      env:
        EDITION: ${{ inputs.edition }}
        ARCH: ${{ inputs.arch }}
      run: python scripts/ci/package-windows-update.py --edition "$EDITION" --arch "$ARCH"
    - name: Sign native Windows update package
      if: inputs.platform == 'windows'
      shell: pwsh
      env:
        EDITION: ${{ inputs.edition }}
        ARCH: ${{ inputs.arch }}
      run: |
        $suffix = if ($env:ARCH -eq 'x86') { 'win32' } else { 'win64' }
        ./scripts/ci/sign-windows.ps1 -Path "build/windows-${env:ARCH}-$env:EDITION/bgdesk-${env:EDITION}-update-$suffix.exe"
    - name: Validate Win32 version and Sciter window
      if: inputs.platform == 'windows' && inputs.arch == 'x86'
      shell: pwsh
      env:
        EDITION: ${{ inputs.edition }}
      run: |
        $app = Resolve-Path "build/windows-x86-$env:EDITION/extracted/bgdesk.exe"
        python -c "import os,subprocess; from pathlib import Path; app=Path('build/windows-x86-'+os.environ['EDITION']+'/extracted/bgdesk.exe').resolve(); result=subprocess.run([str(app),'--version'],check=True,capture_output=True,text=True,timeout=30); assert result.stdout.strip()==os.environ['BGDESK_VERSION'], 'Win32 version mismatch'"
        if ($LASTEXITCODE -ne 0) { throw 'Win32 version check failed' }
        $gui = Start-Process -FilePath $app -ArgumentList '--no-server' -PassThru
        try {
          $visible = $false
          for ($i = 0; $i -lt 30; $i++) {
            $gui.Refresh()
            if ($gui.HasExited) { throw "Win32 GUI exited before opening a window: $($gui.ExitCode)" }
            if ($gui.MainWindowHandle -ne 0) { $visible = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $visible) { throw 'Win32 Sciter did not create its window within 30 seconds' }
          Write-Host 'Win32 app reported the expected version and opened its Sciter window.'
        }
        finally { if (-not $gui.HasExited) { Stop-Process -Id $gui.Id -Force } }
    - name: Build Linux packages in the shared Docker environment
      if: inputs.platform == 'linux'
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        args=("linux-$ARCH")
        [[ "$BGDESK_CLIENTE" == 0 ]] || args=(cliente "linux-$ARCH")
        bash build.sh "${args[@]}"
    - name: Package the existing Linux x64 bundle for Arch
      if: inputs.platform == 'linux' && inputs.arch == 'x86_64'
      shell: bash
      env:
        EDITION: ${{ inputs.edition }}
      run: bash scripts/package-arch-linux.sh "$EDITION"
    - name: Build and verify signed universal Android APK
      if: inputs.platform == 'android'
      shell: bash
      run: |
        args=(android)
        [[ "$BGDESK_CLIENTE" == 0 ]] || args=(cliente android)
        bash build.sh "${args[@]}"
    - name: Collect and validate expected artifacts
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        ARCH: ${{ inputs.arch }}
        EDITION: ${{ inputs.edition }}
      run: python scripts/ci/collect-artifacts.py "$PLATFORM" "$ARCH" "$EDITION" --output "release-artifacts/$PLATFORM-$ARCH-$EDITION"
    - name: Save edition outputs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: build-${{ inputs.platform }}-${{ inputs.arch }}-${{ inputs.edition }}
        path: release-artifacts/${{ inputs.platform }}-${{ inputs.arch }}-${{ inputs.edition }}/*
        if-no-files-found: error
        retention-days: 14
    - name: Publish finished packages to GitHub Releases
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PLATFORM: ${{ inputs.platform }}
        ARCH: ${{ inputs.arch }}
        EDITION: ${{ inputs.edition }}
      run: python scripts/ci/github-release.py --manifest "release-artifacts/$PLATFORM-$ARCH-$EDITION/artifacts.json"
    - name: Publish macOS packaging checkpoint
      if: always() && inputs.platform == 'macos'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: checkpoint-macos-${{ inputs.arch }}-${{ inputs.edition }}
        path: checkpoints/${{ inputs.edition }}
        if-no-files-found: ignore
        retention-days: 14
