name: BGDesk - Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to validate (publishing requires all)
        type: choice
        options: [all, macos, windows, linux, macos-aarch64, macos-x86_64, linux-x86_64, linux-aarch64, windows-x86_64, windows-x86, android, android-universal]
        default: all
      publish:
        description: Publish a new Cargo.toml version to R2 after all builds pass
        type: boolean
        default: false

permissions:
  contents: read

# Serialize releases; do not cancel a run between uploading objects and latest.json.
concurrency:
  group: bgdesk-release
  cancel-in-progress: false

env:
  RUST_VERSION: '1.98.0'
  VCPKG_COMMIT_ID: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
  BGDESK_UPDATE_ORIGIN: ${{ vars.R2_PUBLIC_ORIGIN || 'https://bgdesk.com' }}
  CARGO_BUILD_JOBS: '2'
  VCPKG_MAX_CONCURRENCY: '2'
  VCPKG_CLEAN_AFTER_BUILD: '1'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      flutter_version: ${{ steps.plan.outputs.flutter_version }}
      config_ref: ${{ steps.plan.outputs.config_ref }}
      config_source: ${{ steps.plan.outputs.config_source }}
      matrix: ${{ steps.reuse.outputs.matrix }}
      needs_build: ${{ steps.reuse.outputs.needs_build }}
      publish: ${{ steps.plan.outputs.publish }}
      new_release: ${{ steps.remote.outputs.new_release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography==50.0.0' 'boto3==1.40.55'
      - name: Validate credentials and build plan
        id: plan
        env:
          BUILD_PLATFORMS: ${{ inputs.platforms || vars.BGDESK_RELEASE_TARGET || 'all' }}
          PUBLISH_RELEASE: ${{ (github.event_name == 'push' && (vars.BGDESK_RELEASE_TARGET == '' || vars.BGDESK_RELEASE_TARGET == 'all')) || inputs.publish }}
          BGDESK_CONFIG_SSH_KEY: ${{ secrets.BGDESK_CONFIG_SSH_KEY }}
          BGDESK_CONFIG_TOKEN: ${{ secrets.BGDESK_CONFIG_TOKEN }}
          BGDESK_CONFIG_ARCHIVE: ${{ secrets.BGDESK_CONFIG_ARCHIVE }}
          MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BGDESK_UPDATE_SIGNING_KEY: ${{ secrets.BGDESK_UPDATE_SIGNING_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_ORIGIN: ${{ vars.R2_PUBLIC_ORIGIN }}
        run: python scripts/ci/preflight.py
      - name: Validate release tools
        run: |
          python -m unittest discover -s res/update -p 'test_*metadata*.py'
          python -m unittest discover -s res/update -p 'test_website_release.py'
          python -m unittest discover -s scripts/ci -p 'test_*.py'
          bash scripts/check-linux-build-paths.sh
      - name: Find approved builds of the same version
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          BGDESK_VERSION: ${{ steps.plan.outputs.version }}
          BUILD_MATRIX: ${{ steps.plan.outputs.matrix }}
        run: python scripts/ci/reuse-builds.py --plan
      - name: Check if version was already published
        id: remote
        if: steps.plan.outputs.publish == 'true'
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_ORIGIN: ${{ vars.R2_PUBLIC_ORIGIN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/ci/r2-publish.py --version '${{ steps.plan.outputs.version }}' --check-only

  bridges:
    name: flutter bridge
    if: needs.preflight.outputs.needs_build == 'true'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore generated bridge
        id: bridge-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h
          key: flutter-bridge-v1-${{ hashFiles('src/flutter_ffi.rs', 'flutter/pubspec.yaml', 'flutter/pubspec.lock', 'scripts/generate-bridge.sh', 'scripts/flutter-stable-version') }}
      - name: Install bridge tools
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl git libclang-dev llvm pkg-config unzip xz-utils
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain "$RUST_VERSION" --profile minimal --component rustfmt
          source "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo install cargo-expand --version 1.0.95 --locked
      - name: Generate bridge once
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        run: |
          source "$HOME/.cargo/env"
          export LIBCLANG_PATH="$(llvm-config --libdir)"
          bash scripts/generate-bridge.sh
      - name: Upload shared bridge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-bridge
          if-no-files-found: error
          retention-days: 14
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h

  build:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}${{ matrix.win32 && ' + x86' || '' }} (cliente + suporte)
    needs: [preflight, bridges]
    if: always() && needs.preflight.result == 'success' && (needs.bridges.result == 'success' || needs.bridges.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      actions: read
    env:
      ANDROID_SIGNING_KEY: ${{ matrix.platform == 'android' && secrets.ANDROID_SIGNING_KEY || '' }}
      ANDROID_ALIAS: ${{ matrix.platform == 'android' && secrets.ANDROID_ALIAS || '' }}
      ANDROID_KEY_STORE_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_STORE_PASSWORD || '' }}
      ANDROID_KEY_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}
      BGDESK_REQUIRE_BRIDGE: '1'
      BGDESK_VERSION: ${{ needs.preflight.outputs.version }}
      BGDESK_CHECKPOINT_ORIGIN: ${{ github.sha }}
      # Sciter's pinned x86 branch retains a feature attribute, requiring nightly.
      RUSTUP_TOOLCHAIN: ${{ matrix.arch == 'x86' && 'nightly-2026-09-01' || '1.98.0' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout pinned private configuration
        if: matrix.needs_build && (needs.preflight.outputs.config_source == 'repository')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: boagestao/bgdesk-config
          ref: ${{ needs.preflight.outputs.config_ref }}
          ssh-key: ${{ secrets.BGDESK_CONFIG_SSH_KEY }}
          token: ${{ secrets.BGDESK_CONFIG_TOKEN || github.token }}
          path: config
          persist-credentials: false
      - name: Restore pinned private configuration from Secret
        if: matrix.needs_build && (needs.preflight.outputs.config_source == 'archive')
        env:
          BGDESK_CONFIG_ARCHIVE: ${{ secrets.BGDESK_CONFIG_ARCHIVE }}
        run: python scripts/ci/config_archive.py
      - name: Use the shared Flutter bridge
        if: matrix.needs_build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flutter-bridge
          path: .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Reuse approved packages for the primary architecture
        if: matrix.reuse_run != ''
        uses: ./.github/actions/reuse-build-pair
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          source-run: ${{ matrix.reuse_run }}
          source-commit: ${{ matrix.reuse_commit }}
      - name: Reuse approved Win32 packages on the same Windows runner
        if: matrix.win32 && matrix.win32_reuse_run != ''
        uses: ./.github/actions/reuse-build-pair
        with:
          platform: windows
          arch: x86
          source-run: ${{ matrix.win32_reuse_run }}
          source-commit: ${{ matrix.win32_reuse_commit }}
      - name: Install Rust
        if: matrix.needs_build && (runner.os != 'Linux')
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
          if [[ '${{ matrix.arch }}' == x86 ]]; then
            rustup target add --toolchain "$RUSTUP_TOOLCHAIN" i686-pc-windows-msvc
          fi
          rustup default "$RUSTUP_TOOLCHAIN"
      - name: Cache native dependencies
        if: matrix.needs_build && (runner.os != 'Linux')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.bin/vcpkg
            ~/.cache/vcpkg
            ~/AppData/Local/vcpkg/archives
            .tools/flutter-stable
            .tools/flutter-bridge-tools
            .tools/sciter-win32
          key: native-v2-${{ runner.os }}-${{ matrix.arch }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**', 'scripts/flutter-stable-version') }}
      - name: macOS prerequisites
        if: matrix.needs_build && (runner.os == 'macOS')
        run: |
          brew install nasm autoconf automake libtool pkg-config
          python -m pip install brotli
          cargo install cargo-expand --version 1.0.95 --locked
      - name: Prepare temporary macOS certificate
        if: matrix.needs_build && (runner.os == 'macOS')
        env:
          MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          MACOS_P12_FILE: ${{ runner.temp }}/bgdesk-distribution.p12
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          target = Path(os.environ['MACOS_P12_FILE'])
          target.touch(mode=0o600)
          target.write_bytes(base64.b64decode(os.environ['MACOS_P12_BASE64'], validate=True))
          PY
      - name: Install Flutter for Windows
        if: matrix.needs_build && (runner.os == 'Windows' && matrix.arch != 'x86' && matrix.reuse_run == '')
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ needs.preflight.outputs.flutter_version }}
          channel: stable
          cache: true
      - name: Windows prerequisites
        if: matrix.needs_build && (runner.os == 'Windows')
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install brotli
      - name: Install LLVM for Windows bindings
        if: matrix.needs_build && (runner.os == 'Windows')
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
        with:
          version: '15.0.6'
          directory: ${{ runner.temp }}/bgdesk-llvm
          env: false
      - name: Check Windows certificate and timestamp before compiling
        if: matrix.needs_build && (runner.os == 'Windows')
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'bgdesk-signing-probe.exe'
          Copy-Item "$env:SystemRoot/System32/where.exe" $probe
          try { ./scripts/ci/sign-windows.ps1 -Path $probe }
          finally { Remove-Item $probe -Force -ErrorAction SilentlyContinue }
      - name: Configure Windows build environment
        if: matrix.needs_build && (runner.os == 'Windows' && matrix.arch != 'x86' && matrix.reuse_run == '')
        env:
          # A shared cache may last have been reconciled for Win32; restore the
          # complete x64 manifest, not just the existing host FFmpeg headers.
          BGDESK_VERIFY_VCPKG_MANIFEST: '1'
        run: |
          export FLUTTER_DIR="$(cygpath -u "$FLUTTER_ROOT")"
          export VCPKG_ROOT="$HOME/.bin/vcpkg"
          export BGDESK_LLVM_ROOT="$(cygpath -u "$RUNNER_TEMP")/bgdesk-llvm"
          export LIBCLANG_PATH="$BGDESK_LLVM_ROOT/bin"
          cargo install cargo-expand --version 1.0.95 --locked
          export FLUTTER_VERSION="$(sed '/^#/d; /^$/d' scripts/flutter-stable-version | tail -1)"
          bash scripts/setup-windows-build.sh --skip-vs
          bash .github/patches/apply_flutter_3.44_source_patches.sh
      - name: Configure Win32 dependencies without Flutter
        if: matrix.needs_build && (runner.os == 'Windows' && matrix.arch == 'x86')
        run: bash scripts/ci/setup-windows-x86.sh
      - name: Install Flutter for Android
        if: matrix.needs_build && matrix.platform == 'android'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ needs.preflight.outputs.flutter_version }}
      - name: Set up Android toolchain and validate release signing
        if: matrix.needs_build && matrix.platform == 'android'
        run: bash scripts/ci/setup-android.sh
      - name: Cache Android native dependencies
        if: matrix.needs_build && matrix.platform == 'android'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-native-v1-${{ runner.os }}-r28c-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'res/vcpkg/**', 'res/vcpkg-triplets/**', 'flutter/android/**/*.gradle', 'flutter/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Set up Linux image cache
        if: matrix.needs_build && matrix.platform == 'linux'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Linux environment
        if: matrix.needs_build && matrix.platform == 'linux'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/build-linux-${{ matrix.arch }}.dockerfile
          tags: bgdesk-build-${{ matrix.arch }}:latest
          load: true
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.arch }}
      - name: Build, sign, and save cliente
        if: matrix.reuse_run == ''
        uses: ./.github/actions/build-edition
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          edition: cliente
        env:
          MACOS_P12_FILE: ${{ runner.temp }}/bgdesk-distribution.p12
          MACOS_P12_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_P12_PASSWORD || '' }}
          MACOS_CODESIGN_IDENTITY: ${{ runner.os == 'macOS' && secrets.MACOS_CODESIGN_IDENTITY || '' }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID || '3Z7C3Q7NMT' }}
          MACOS_NOTARY_APPLE_ID: ${{ runner.os == 'macOS' && secrets.MACOS_NOTARY_APPLE_ID || '' }}
          MACOS_NOTARY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_NOTARY_PASSWORD || '' }}
      - name: Build, sign, and save suporte
        if: matrix.reuse_run == ''
        uses: ./.github/actions/build-edition
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          edition: suporte
        env:
          MACOS_P12_FILE: ${{ runner.temp }}/bgdesk-distribution.p12
          MACOS_P12_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_P12_PASSWORD || '' }}
          MACOS_CODESIGN_IDENTITY: ${{ runner.os == 'macOS' && secrets.MACOS_CODESIGN_IDENTITY || '' }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID || '3Z7C3Q7NMT' }}
          MACOS_NOTARY_APPLE_ID: ${{ runner.os == 'macOS' && secrets.MACOS_NOTARY_APPLE_ID || '' }}
          MACOS_NOTARY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MACOS_NOTARY_PASSWORD || '' }}
      - name: Build, sign, and save Win32 on the same Windows runner
        if: runner.os == 'Windows' && matrix.win32 && matrix.win32_reuse_run == ''
        uses: ./.github/actions/build-windows-x86-pair
      - name: Remove temporary Android signing files
        if: always() && matrix.platform == 'android'
        run: |
          rm -f flutter/android/key.properties
          rm -rf "$RUNNER_TEMP/bgdesk-android-signing"
      - name: Remove temporary macOS certificate
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/bgdesk-distribution.p12"

  publish:
    needs: [preflight, build]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: build-*
          path: artifacts
      - run: python -m pip install 'cryptography==50.0.0' 'boto3==1.40.55'
      - name: Sign, upload to R2, verify public URLs, and announce release
        if: needs.preflight.outputs.new_release == 'true'
        env:
          BGDESK_UPDATE_SIGNING_KEY: ${{ secrets.BGDESK_UPDATE_SIGNING_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_ORIGIN: ${{ vars.R2_PUBLIC_ORIGIN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/ci/r2-publish.py --version '${{ needs.preflight.outputs.version }}'
      - name: Publish Android downloads without changing existing desktop metadata
        env:
          BGDESK_UPDATE_SIGNING_KEY: ${{ secrets.BGDESK_UPDATE_SIGNING_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_ORIGIN: ${{ vars.R2_PUBLIC_ORIGIN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/ci/publish-android.py --version '${{ needs.preflight.outputs.version }}'
      - name: Publish or complete stable GitHub Release, including both Windows editions
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_RELEASE: ${{ needs.preflight.outputs.new_release }}
        shell: bash
        run: |
          args=(--stable --version '${{ needs.preflight.outputs.version }}')
          [[ "$NEW_RELEASE" == true ]] || args+=(--reconcile-existing)
          python scripts/ci/github-release.py "${args[@]}"
