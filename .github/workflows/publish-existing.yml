name: BGDesk - Publish existing packages

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed release.yml run whose five builds all passed
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: bgdesk-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify all source builds and pin their original commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: python scripts/ci/publish-source.py "$SOURCE_RUN"
      - name: Download the original ten artifact bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          pattern: build-*
          path: artifacts
      - run: python -m pip install 'cryptography==50.0.0' 'boto3==1.40.55'
      - name: Validate publication tools
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Resume signed publication to R2 without rebuilding
        env:
          BGDESK_UPDATE_SIGNING_KEY: ${{ secrets.BGDESK_UPDATE_SIGNING_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_ORIGIN: ${{ vars.R2_PUBLIC_ORIGIN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: python scripts/ci/r2-publish.py --version "$VERSION" --source-commit "$SOURCE_COMMIT"
      - name: Publish the complete stable GitHub Release at the build commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: python scripts/ci/github-release.py --stable --version "$VERSION" --commit "$SOURCE_COMMIT"
